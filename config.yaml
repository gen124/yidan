data:
  train_csv: "./data/train_manifest.csv"
  val_csv: "./data/val_manifest.csv"
  input_size: [192,192,128]
model:
  in_channels: 3
  base_channels: 32
  norm: group     # 'batch' or 'group' (group is better for small batch sizes)
  num_groups: 8
  dropout: 0.4
  pretrained: false
train:
  use_variational_inference: true  # 启用VI
  adaptive_hyperparams: true       # 启用自适应超参数
  batch_size: 2048
  lr: 4e-4
  weight_decay: 1e-4
  max_epochs: 24
  patience: 10
  device: "cuda"
  num_workers: 8
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: false
  amp: true
  cudnn_benchmark: true
  seed: 42 
  balanced_sampler: true   # use weighted sampling to help small datasets
  augmentations:
    flip: true
    noise_sigma: 0.01
    intensity_scale: true
    intensity_scale_range: 0.2
    rotate90: true
    rotate90_prob: 0.5
  
  # ====== Patch级训练参数 ======
  patch_size: [48, 48, 32]      # [H, W, D]
  patch_stride: [24, 24, 16]    # 无重叠时等于patch_size
  pooling: attention
  topk_percent: 0.15
  # ====== 重标(relabel)相关 ======
  relabel_use_feature_score: false
  feature_score_type: l2
  feature_score_mlp_ckpt: null
  feature_score_mlp_hidden: 64
  
  # 预训练阶段
  pretrain_epochs: 20
  
  # 迭代重标参数
  n_relabel_iters: 2
  high_conf_threshold: 0.8
  low_conf_threshold: 0.3

  # 自适应重标调度
  finetune_epochs_schedule: [5, 3]
  lr_decay_schedule: [0.3, 0.1]
  early_stop_threshold: 0.005

  # Bayesian扩展选项
  use_variational_inference: true
  use_mcmc: false
  adaptive_hyperparams: true
  finetune_epochs: 8            # 每轮迭代微调的epoch数
  head_finetune_epochs: 4       # 阶段1(冻结骨干)的epoch数
  backbone_finetune_epochs: 8   # 阶段4.2(解冻骨干联合训练)的epoch数
  aggregator_epochs: 10         # Stage 5(Attention Aggregator训练)的epoch数
  # 损失函数设置: 'bce' 或 'focal'
  loss: bce
  focal_alpha: 0.25
  focal_gamma: 2.0
explainer:
  supervoxel_n_segments: 200    # SLIC超体素数量
  topk_path: 3                   # 返回前3个重要路径
  n_runs: 3                      # GNN解释运行次数(平均化)
  noise_std: 1e-3                # 特征噪声标准差(鲁棒性)
