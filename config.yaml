data:
  train_csv: "./data/train_manifest.csv"
  val_csv: "./data/val_manifest.csv"
  input_size: [192,192,128]
model:
  in_channels: 3
  base_channels: 32
  norm: group     # 'batch' or 'group' (group is better for small batch sizes)
  num_groups: 8
  dropout: 0.4
  pretrained: false
train:
  batch_size: 2048
  lr: 4e-4
  weight_decay: 1e-4
  max_epochs: 24
  patience: 10
  device: "cuda"
  num_workers: 8
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: false
  amp: true
  cudnn_benchmark: true
  seed: 42
  balanced_sampler: true   # use weighted sampling to help small datasets
  augmentations:
    flip: true
    noise_sigma: 0.01
    intensity_scale: true
    intensity_scale_range: 0.2
    rotate90: true
    rotate90_prob: 0.5
  
  # ====== Patch级训练参数 ======
  # 原始体积切patch的大小
  patch_size: [48, 48, 32]      # [H, W, D]
  patch_stride: [48, 48, 32]    # 无重叠时等于patch_size; 可设更小的值产生重叠patch
  pooling: topk_mean            # patch级聚合方式: topk_mean | max | attention(需非重叠,会返回特征)
  topk_percent: 0.1            # topk_mean比例/attention默认保留
  
  # 预训练阶段
  pretrain_epochs: 20
  
  # 迭代重标参数
  n_relabel_iters: 6            # 迭代轮次
  high_conf_threshold: 0.8      # 高置信正样本阈值（收紧，减少伪正）
  low_conf_threshold: 0.4       # 高置信负样本阈值（放宽，捕获负样本）
  
  # 微调参数
  finetune_epochs: 8            # 每轮迭代微调的epoch数
  head_finetune_epochs: 5       # 阶段1(冻结骨干)的epoch数
  final_epochs: 30              # 阶段2(联合训练)的epoch数
explainer:
  supervoxel_n_segments: 200    # SLIC超体素数量
  topk_path: 3                   # 返回前3个重要路径
  n_runs: 3                      # GNN解释运行次数(平均化)
  noise_std: 1e-3                # 特征噪声标准差(鲁棒性)
